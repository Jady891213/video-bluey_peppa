<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>准备礼物 · SVG动画小样</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3e9;color:#354c47;font:16px/1.7 system-ui,sans-serif}main{max-width:1152px;margin:0 auto;padding:34px 24px 60px}.eyebrow{font-size:14px;color:#7a8980}h1{font-size:clamp(25px,5vw,38px);margin:9px 0 20px;line-height:1.25}video{display:block;width:100%;aspect-ratio:16/9;background:#fff2ad;border-radius:14px}.lines{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.line{border:1px solid #dedfd0;border-radius:12px;padding:16px;background:#fffefa;color:inherit;text-align:left;font:inherit;cursor:pointer}.line b{display:block;font-size:14px;color:#748a7d}.line.active{border-color:#8db4a3;background:#e8f0e3}.note{font-size:14px;color:#748176}a{color:#4b7763;text-underline-offset:3px}footer{margin-top:25px}@media(max-width:650px){main{padding:23px 14px 40px}.lines{grid-template-columns:1fr;gap:10px}video{border-radius:9px}}
</style><main><div class="eyebrow">准备礼物 / 佩奇画画，乔治拿笔</div><h1>一起准备一个小惊喜。</h1><video id="sample" controls playsinline preload="metadata" poster="预览封面.png" src="准备礼物_佩奇画画与乔治拿笔_SVG小样_10秒.mp4"></video><div class="lines"><button class="line" data-start="0.666666667" data-end="4.09161"><b>佩奇 · 点击重听</b>我要画我们四个，一起踢足球！</button><button class="line" data-start="4.5" data-end="8.029434"><b>乔治 · 点击重听</b>我也来画，我要绿色的！</button></div><p class="note">10秒 · 720P · 现有完整配音。当前是造型与动作小样，待确认。</p><footer><a href="佩奇与乔治_分层矢量预览.svg">查看矢量画面</a></footer></main><script>const v=document.querySelector('video');const bs=[...document.querySelectorAll('.line')];bs.forEach(b=>b.addEventListener('click',()=>{v.currentTime=Number(b.dataset.start);v.play()}));v.addEventListener('timeupdate',()=>bs.forEach(b=>b.classList.toggle('active',v.currentTime>=Number(b.dataset.start)&&v.currentTime<Number(b.dataset.end))));</script></html>
